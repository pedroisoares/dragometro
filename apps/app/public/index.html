<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <script>
      // O banco local na Web precisa de isolamento de origem (cabeçalhos COOP/COEP).
      // No servidor de desenvolvimento, a raiz "/" vem sem esses cabeçalhos; as demais
      // rotas vêm com eles. Então a raiz recarrega uma vez em /inicio, que volta para "/"
      // pelo roteador, sem recarregar (veja src/app/inicio.tsx).
      if (window.isSecureContext && !window.crossOriginIsolated && location.pathname === '/') {
        location.replace('/inicio' + location.search + location.hash);
      }
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Ative o JavaScript para usar o Dragômetro.</noscript>
    <div id="root"></div>
  </body>
</html>
